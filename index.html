<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myster X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      color: #86efac;
    }

    #story {
      min-height: 100px;
      background: rgba(0,0,0,0.2);
      border-radius: 15px;
      padding: 18px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111827;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="game">

    <div class="logo">🕵️ Myster X</div>

    <div class="subtitle">
      Das mysteriöse Abenteuer beginnt.
    </div>

    <div class="card">

      <div class="status">
        🟢 Myster X ist online
      </div>

      <div id="story">
        Du stehst vor einem verlassenen Gebäude.
        Niemand ist zu sehen. Doch plötzlich hörst du ein Geräusch aus dem Inneren...
      </div>

      <button onclick="startGame()">
        🔎 Gebäude untersuchen
      </button>

      <button onclick="followSound()">
        👂 Dem Geräusch folgen
      </button>

      <button onclick="leaveBuilding()">
        🚪 Gebäude verlassen
      </button>

    </div>

  </div>

  <script>
    function startGame() {
      document.getElementById("story").innerText =
        "Du betrittst vorsichtig das Gebäude. Auf dem Boden findest du eine geheimnisvolle schwarze Karte...";
    }

    function followSound() {
      document.getElementById("story").innerText =
        "Du folgst dem Geräusch. Eine Tür öffnet sich langsam von selbst. Dahinter wartet ein unbekanntes Geheimnis...";
    }

    function leaveBuilding() {
      document.getElementById("story").innerText =
        "Du verlässt das Gebäude. Doch auf deinem Handy erscheint plötzlich eine Nachricht: 'Du kannst nicht entkommen...'";
    }
  </script>

</body>
</html>
